name: Inspect paper archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-paper-archive.yml"
      - "tools/inspect_archive.py"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extractors
        run: python -m pip install --upgrade python-docx pypdf

      - name: Inspect archive and extract text
        run: python tools/inspect_archive.py

      - name: Commit workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_workspace
          if git diff --cached --quiet; then
            echo "No workspace changes to commit."
          else
            git commit -m "Extract paper and reference text for review"
            git push origin HEAD:main
          fi
