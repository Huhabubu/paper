name: Rebuild paper references

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-paper-references.yml"
      - "tools/rebuild_references.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --upgrade lxml

      - name: Rebuild citations and references
        run: python tools/rebuild_references.py

      - name: Commit final paper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final
          if git diff --cached --quiet; then
            echo "No final changes."
          else
            git commit -m "Rebuild paper references and citations"
            git push origin HEAD:main
          fi
